<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganadera Panamericana · Seguí tu pedido</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#061c5d; --navy-dark:#031343; --red:#e34b00; --blue:#1F6ED4; --blue-border:#7BB4FF; --white:#ffffff;
    --body-bg:#f7f7f9; --grey:#444444; --grey-100:#929292; --grey-300:#dbdbdb; --grey-500:#f5f5f5;
    --font-base:'Lato', sans-serif; --font-title:'Frank Ruhl Libre', serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--body-bg); color:var(--grey); font-family:var(--font-base); padding:20px; }
  .app{ max-width:560px; margin:0 auto; border-radius:14px; overflow:hidden; background:var(--white); box-shadow:0 4px 18px rgba(3,19,67,.12); }
  .topbar{ background:var(--navy-dark); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:14px 20px; }
  .brand-text{ font-family:var(--font-title); font-weight:900; font-size:14px; text-transform:uppercase; }
  .order-id{ font-size:11px; color:rgba(255,255,255,.7); }
  .map{ height:300px; width:100%; }
  .panel{ padding:22px; text-align:center; }
  .estado{ font-family:var(--font-title); font-weight:900; font-size:20px; color:var(--navy-dark); margin:0 0 4px; }
  .row{ display:flex; gap:10px; margin-top:16px; }
  .stat{ flex:1; background:var(--grey-500); border:1px solid var(--grey-300); border-radius:8px; padding:14px; }
  .stat-label{ font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--grey-100); font-weight:700; margin:0 0 6px; }
  .stat-value{ font-family:var(--font-title); font-weight:900; font-size:22px; color:var(--blue); margin:0; }
  .waiting{ font-size:13px; color:var(--grey-100); margin-top:10px; }
  .delivered-badge{ display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:6px; background:#e9f9ef; border:1px solid #3ddc84; color:#1a7a41; font-weight:700; font-size:13px; margin-top:14px; }
  .sig-thumb{ width:180px; background:#fff; border:1px solid var(--grey-300); border-radius:6px; margin-top:10px; display:block; margin-left:auto; margin-right:auto; }
  .config-warning{ padding:12px 20px; background:#fdece2; font-size:12px; color:var(--red); font-weight:700; display:none; }
</style>
</head>
<body>

<div class="app">
  <div class="config-warning" id="config-warning">Falta configurar Firebase: reemplazá TODO_FIREBASE_CONFIG en el código.</div>
  <div class="topbar">
    <span class="brand-text">Ganadera Panamericana</span>
    <span class="order-id" id="order-id-label">pedido: —</span>
  </div>

  <div id="map" class="map"></div>

  <div class="panel">
    <p class="estado" id="cli-estado">Esperando al repartidor</p>
    <p class="waiting" id="cli-waiting">Todavía no salió. Esta página se actualiza sola.</p>

    <div class="row" id="cli-stats" style="display:none;">
      <div class="stat"><p class="stat-label">Distancia</p><p class="stat-value" id="cli-dist">—</p></div>
      <div class="stat"><p class="stat-label">Llega en</p><p class="stat-value" id="cli-eta">—</p></div>
    </div>

    <div id="cli-delivered" style="display:none;">
      <div class="delivered-badge">Entregado a las <b id="cli-delivered-time"></b></div>
      <img id="cli-sig-thumb" class="sig-thumb" alt="Firma de conformidad">
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  var firebaseConfig = {
    apiKey: "AIzaSyCbI1PcP5f1jeqZSQRsNME2uEk_IK0yWqQ",
    authDomain: "ganadera-envios.firebaseapp.com",
    databaseURL: "https://ganadera-envios-default-rtdb.firebaseio.com",
    projectId: "ganadera-envios",
    storageBucket: "ganadera-envios.firebasestorage.app",
    messagingSenderId: "876135437382",
    appId: "1:876135437382:web:bbc0d1b874fef3f1ca6647",
    measurementId: "G-WBBF6N5TM2"
  };
  var configured = firebaseConfig !== "TODO_FIREBASE_CONFIG";
  if (!configured) document.getElementById('config-warning').style.display = 'block';

  var orderId = new URLSearchParams(window.location.search).get('id') || 'demo';
  document.getElementById('order-id-label').textContent = 'pedido: ' + orderId;

  var db = null;
  if (configured) { firebase.initializeApp(firebaseConfig); db = firebase.database(); }

  var map = L.map('map', {zoomControl:true, attributionControl:false}).setView([-34.6037,-58.3816], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19}).addTo(map);

  var vanIcon = L.divIcon({ className:'', html:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="1" y="1" width="22" height="22" rx="6" fill="#1F6ED4"/><path d="M6 15.5V9.5C6 8.4 6.9 7.5 8 7.5H13.5V15.5" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/><path d="M13.5 10.5H16.3L18.5 12.7V15.5H13.5" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/><circle cx="9" cy="16" r="1.4" fill="#fff"/><circle cx="16" cy="16" r="1.4" fill="#fff"/></svg>', iconSize:[26,26] });
  var pinIcon = L.divIcon({ className:'', html:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 22s7-7.4 7-12.5A7 7 0 1 0 5 9.5C5 14.6 12 22 12 22Z" fill="#061c5d"/><circle cx="12" cy="9.5" r="2.6" fill="#fff"/></svg>', iconSize:[24,24], iconAnchor:[12,22] });

  var vanMarker = null, destino = null, routeLine = null, lastRouteFetch = 0;

  if (configured){
    db.ref('pedidos/' + orderId + '/destino').once('value', function(snap){
      destino = snap.val();
      if (destino){
        L.marker([destino.lat, destino.lng], {icon: pinIcon}).addTo(map);
        map.setView([destino.lat, destino.lng], 13);
      }
    });

    db.ref('pedidos/' + orderId + '/posicion').on('value', function(snap){
      var data = snap.val();
      if (!data) return;
      var latlng = [data.lat, data.lng];
      if (!vanMarker) vanMarker = L.marker(latlng, {icon: vanIcon}).addTo(map);
      else vanMarker.setLatLng(latlng);
      map.panTo(latlng);
      document.getElementById('cli-estado').textContent = 'Tu pedido está en camino';
      document.getElementById('cli-waiting').style.display = 'none';
      document.getElementById('cli-stats').style.display = 'flex';
      updateRoute(latlng);
    });

    db.ref('pedidos/' + orderId + '/entrega').on('value', function(snap){
      var data = snap.val();
      if (!data || !data.confirmado) return;
      document.getElementById('cli-estado').textContent = 'Pedido entregado';
      document.getElementById('cli-stats').style.display = 'none';
      document.getElementById('cli-delivered').style.display = 'block';
      document.getElementById('cli-delivered-time').textContent = new Date(data.hora).toLocaleTimeString();
      document.getElementById('cli-sig-thumb').src = data.firma;
    });
  }

  async function updateRoute(from){
    if (!destino) return;
    var now = Date.now();
    if (now - lastRouteFetch < 8000) return;
    lastRouteFetch = now;
    try {
      var url = 'https://router.project-osrm.org/route/v1/driving/' + from[1] + ',' + from[0] + ';' + destino.lng + ',' + destino.lat + '?overview=full&geometries=geojson';
      var res = await fetch(url);
      var data = await res.json();
      if (data.code !== 'Ok') return;
      var route = data.routes[0];
      document.getElementById('cli-dist').textContent = (route.distance / 1000).toFixed(1) + ' km';
      document.getElementById('cli-eta').textContent = Math.max(1, Math.round(route.duration / 60)) + ' min';
      var coords = route.geometry.coordinates.map(function(c){ return [c[1], c[0]]; });
      if (routeLine) map.removeLayer(routeLine);
      routeLine = L.polyline(coords, {color:'#1F6ED4', weight:4, opacity:0.75}).addTo(map);
    } catch(e){ /* silencioso */ }
  }
</script>
</body>
</html>
